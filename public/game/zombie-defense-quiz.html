<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Zombie Tower Defense Quiz Game — Gamifikasi IFP untuk pembelajaran Informatika Kelas 9">
  <title>🧟 Zombie Defense Quiz — Standalone Single File</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧟</text></svg>">
  <style>
    /* ============================================================
       ZOMBIE TOWER DEFENSE QUIZ — STYLES
       ============================================================ */
    :root {
      --bg-primary: #0a0b1a;
      --bg-secondary: #111228;
      --bg-card: rgba(20, 22, 48, 0.85);
      --bg-glass: rgba(255, 255, 255, 0.04);
      --border-glass: rgba(255, 255, 255, 0.08);

      --text-primary: #e8eaf6;
      --text-secondary: #9598b8;
      --text-dim: #5a5d7a;

      --neon-green: #39ff14;
      --neon-blue: #00d4ff;
      --neon-red: #ff3a5e;
      --neon-yellow: #ffd700;
      --neon-purple: #c156ff;
      --neon-orange: #ff7b2e;

      --team-1: #ff4466;
      --team-1-glow: rgba(255, 68, 102, 0.3);
      --team-2: #4488ff;
      --team-2-glow: rgba(68, 136, 255, 0.3);
      --team-3: #44dd66;
      --team-3-glow: rgba(68, 221, 102, 0.3);
      --team-4: #ffcc22;
      --team-4-glow: rgba(255, 204, 34, 0.3);

      --danger: #ff3a5e;
      --success: #39ff14;
      --warning: #ffd700;

      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-xl: 28px;

      --shadow-neon: 0 0 20px rgba(0, 212, 255, 0.15), 0 0 60px rgba(0, 212, 255, 0.05);
      --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.4);
      --shadow-deep: 0 16px 48px rgba(0, 0, 0, 0.6);

      --transition-fast: 150ms ease;
      --transition-normal: 300ms ease;
      --transition-smooth: 500ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      cursor: default;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background:
        radial-gradient(ellipse at 20% 20%, rgba(0, 212, 255, 0.06) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(193, 86, 255, 0.06) 0%, transparent 50%),
        var(--bg-primary);
    }

    .screen {
      display: none;
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
    }

    .screen.active {
      display: flex;
    }

    /* SETUP SCREEN */
    #setup-screen {
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 30px;
      background:
        radial-gradient(circle at 30% 30%, rgba(57, 255, 20, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 70% 70%, rgba(255, 58, 94, 0.05) 0%, transparent 40%),
        var(--bg-primary);
    }

    .setup-title {
      text-align: center;
      animation: titlePulse 3s ease-in-out infinite;
    }

    .setup-title h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 3.5rem;
      font-weight: 900;
      background: linear-gradient(135deg, var(--neon-green), var(--neon-blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 20px rgba(57, 255, 20, 0.3));
      letter-spacing: 3px;
    }

    .setup-title .subtitle {
      font-family: 'Press Start 2P', cursive;
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-top: 10px;
      letter-spacing: 2px;
    }

    .setup-title .zombie-emoji {
      font-size: 4rem;
      display: block;
      margin-bottom: 10px;
      animation: zombieWalk 1s ease-in-out infinite;
    }

    @keyframes zombieWalk {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-8px) rotate(2deg); }
    }

    @keyframes titlePulse {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.1); }
    }

    .team-selector {
      display: flex;
      gap: 20px;
      margin: 10px 0;
    }

    .team-count-btn {
      width: 80px;
      height: 80px;
      border: 2px solid var(--border-glass);
      border-radius: var(--radius-lg);
      background: var(--bg-glass);
      backdrop-filter: blur(12px);
      color: var(--text-secondary);
      font-family: 'Orbitron', sans-serif;
      font-size: 2rem;
      font-weight: 700;
      cursor: pointer;
      transition: all var(--transition-normal);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .team-count-btn:hover {
      border-color: var(--neon-blue);
      color: var(--neon-blue);
      background: rgba(0, 212, 255, 0.08);
      transform: scale(1.08);
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.2);
    }

    .team-count-btn.selected {
      border-color: var(--neon-green);
      color: var(--neon-green);
      background: rgba(57, 255, 20, 0.1);
      box-shadow: 0 0 25px rgba(57, 255, 20, 0.25);
      transform: scale(1.1);
    }

    .team-count-btn span {
      font-size: 0.65rem;
      display: block;
      margin-top: 2px;
      font-weight: 400;
    }

    .diff-selector {
      display: flex;
      gap: 14px;
      justify-content: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .diff-btn {
      width: 140px;
      min-height: 70px;
      border-radius: var(--radius-lg);
      border: 2px solid var(--border-glass);
      background: var(--bg-glass);
      color: var(--text-dim);
      font-family: 'Orbitron', sans-serif;
      cursor: pointer;
      transition: all var(--transition-normal);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 8px 10px;
      text-align: center;
    }
    .diff-btn .diff-title {
      font-size: 0.92rem;
      font-weight: 800;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .diff-btn .diff-desc {
      font-size: 0.65rem;
      color: var(--text-dim);
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      line-height: 1.2;
    }
    .diff-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 4px 18px rgba(0, 212, 255, 0.15);
    }
    .diff-btn[data-mode="easy"]:hover, .diff-btn[data-mode="easy"].selected {
      border-color: #10b981;
      color: #10b981;
      background: rgba(16, 185, 129, 0.12);
      box-shadow: 0 0 24px rgba(16, 185, 129, 0.3);
    }
    .diff-btn[data-mode="normal"]:hover, .diff-btn[data-mode="normal"].selected {
      border-color: #f59e0b;
      color: #f59e0b;
      background: rgba(245, 158, 11, 0.12);
      box-shadow: 0 0 24px rgba(245, 158, 11, 0.3);
    }
    .diff-btn[data-mode="hard"]:hover, .diff-btn[data-mode="hard"].selected {
      border-color: #ef4444;
      color: #ef4444;
      background: rgba(239, 68, 68, 0.12);
      box-shadow: 0 0 24px rgba(239, 68, 68, 0.3);
    }
    .diff-btn.selected .diff-desc {
      color: rgba(255, 255, 255, 0.9);
    }

    .mode-badge {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.68rem;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: var(--radius-pill);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .mode-badge.easy {
      background: rgba(16, 185, 129, 0.18);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }
    .mode-badge.normal {
      background: rgba(245, 158, 11, 0.18);
      color: #f59e0b;
      border: 1px solid rgba(245, 158, 11, 0.4);
    }
    .mode-badge.hard {
      background: rgba(239, 68, 68, 0.18);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }

    .team-inputs {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 800px;
    }

    .team-input-group {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg-glass);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-md);
      padding: 10px 18px;
      backdrop-filter: blur(10px);
      transition: all var(--transition-normal);
    }

    .team-input-group .team-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .team-input-group input {
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      width: 160px;
    }

    .team-input-group input::placeholder {
      color: var(--text-dim);
    }

    .start-btn {
      padding: 16px 60px;
      font-family: 'Orbitron', sans-serif;
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 3px;
      border: none;
      border-radius: var(--radius-xl);
      background: linear-gradient(135deg, var(--neon-green), #20cc44);
      color: #0a0b1a;
      cursor: pointer;
      transition: all var(--transition-normal);
      box-shadow: 0 4px 24px rgba(57, 255, 20, 0.3);
      text-transform: uppercase;
      margin-top: 10px;
    }

    .start-btn:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 8px 36px rgba(57, 255, 20, 0.45);
    }

    .start-btn:active {
      transform: translateY(0) scale(0.98);
    }

    /* GAME SCREEN */
    #game-screen {
      flex-direction: column;
    }

    .leaderboard-bar {
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-glass);
      flex-shrink: 0;
      z-index: 10;
    }

    .leaderboard-bar .wave-info {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--neon-blue);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .leaderboard-bar .wave-info .wave-num {
      background: rgba(0, 212, 255, 0.15);
      padding: 4px 14px;
      border-radius: 20px;
      border: 1px solid rgba(0, 212, 255, 0.3);
    }

    .base-hp-section {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'Orbitron', sans-serif;
    }

    .base-hp-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--neon-blue);
      letter-spacing: 1px;
    }

    .base-hp-bar-outer {
      width: 180px;
      height: 14px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 7px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      position: relative;
    }

    .base-hp-bar-inner {
      height: 100%;
      background: linear-gradient(90deg, #39ff14, #20cc44);
      border-radius: 7px;
      transition: width 0.3s ease, background 0.5s ease;
      box-shadow: 0 0 8px rgba(57, 255, 20, 0.3);
    }

    .base-hp-bar-inner.warning {
      background: linear-gradient(90deg, #ffd700, #ffaa00);
      box-shadow: 0 0 8px rgba(255, 215, 0, 0.3);
    }

    .base-hp-bar-inner.danger {
      background: linear-gradient(90deg, #ff3a5e, #ff0033);
      box-shadow: 0 0 8px rgba(255, 58, 94, 0.4);
      animation: pulse 0.8s ease-in-out infinite;
    }

    .base-hp-text {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--text-secondary);
      min-width: 75px;
    }

    .leaderboard-teams {
      display: flex;
      gap: 24px;
      align-items: center;
    }

    .lb-team {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 4px 16px;
      border-radius: 20px;
      background: var(--bg-glass);
      border: 1px solid var(--border-glass);
      transition: all var(--transition-fast);
    }

    .lb-team .lb-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .lb-team .lb-score {
      color: var(--neon-yellow);
      min-width: 50px;
      text-align: right;
    }

    .lb-team.leading {
      border-color: var(--neon-yellow);
      box-shadow: 0 0 12px rgba(255, 215, 0, 0.2);
    }

    .game-controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-sm);
      background: var(--bg-glass);
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      transition: all var(--transition-fast);
    }

    .icon-btn:hover {
      border-color: var(--neon-blue);
      color: var(--neon-blue);
      background: rgba(0, 212, 255, 0.08);
    }

    .game-canvas-area {
      flex: 1;
      position: relative;
      min-height: 0;
    }

    #gameCanvas {
      width: 100%;
      height: 100%;
      display: block;
      background: #0d0e20;
    }

    .wave-announce {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      font-family: 'Orbitron', sans-serif;
      font-size: 3rem;
      font-weight: 900;
      color: var(--neon-blue);
      text-shadow: 0 0 30px rgba(0, 212, 255, 0.5), 0 0 60px rgba(0, 212, 255, 0.2);
      z-index: 20;
      pointer-events: none;
      opacity: 0;
    }

    .wave-announce.show {
      animation: waveAnnounce 2s ease forwards;
    }

    @keyframes waveAnnounce {
      0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
      20% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
      80% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; }
    }

    .boss-announce {
      color: var(--neon-red) !important;
      text-shadow: 0 0 30px rgba(255, 58, 94, 0.6), 0 0 60px rgba(255, 58, 94, 0.3) !important;
    }

    .quiz-area {
      display: flex;
      gap: 3px;
      padding: 3px;
      height: 38%;
      flex-shrink: 0;
      background: var(--bg-secondary);
      border-top: 2px solid var(--border-glass);
    }

    .quiz-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-radius: var(--radius-md);
      overflow: hidden;
      position: relative;
      border: 1px solid var(--border-glass);
      background: var(--bg-card);
      transition: border-color var(--transition-fast);
    }

    .quiz-panel.correct-flash {
      border-color: var(--success);
      box-shadow: inset 0 0 30px rgba(57, 255, 20, 0.1);
    }

    .quiz-panel.wrong-flash {
      border-color: var(--danger);
      box-shadow: inset 0 0 30px rgba(255, 58, 94, 0.1);
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px;
      border-bottom: 1px solid var(--border-glass);
      flex-shrink: 0;
    }

    .panel-header .team-name-display {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .panel-header .team-name-display .p-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .panel-header .panel-stats {
      display: flex;
      gap: 12px;
      font-size: 0.7rem;
      color: var(--text-secondary);
    }

    .panel-header .panel-stats .stat-val {
      font-weight: 700;
      color: var(--text-primary);
    }

    .question-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 10px 14px;
      min-height: 0;
    }

    .question-topic {
      font-size: 0.6rem;
      color: var(--neon-purple);
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .question-text {
      font-size: 0.88rem;
      line-height: 1.45;
      color: var(--text-primary);
      font-weight: 500;
      margin-bottom: 10px;
      flex-shrink: 0;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      flex: 1;
      min-height: 0;
    }

    .option-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-sm);
      background: var(--bg-glass);
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition-fast);
      text-align: left;
      line-height: 1.3;
      overflow: hidden;
    }

    .option-btn .opt-letter {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.7rem;
      font-weight: 700;
      flex-shrink: 0;
      transition: all var(--transition-fast);
    }

    .option-btn:hover {
      border-color: var(--neon-blue);
      background: rgba(0, 212, 255, 0.06);
    }

    .option-btn:hover .opt-letter {
      background: rgba(0, 212, 255, 0.15);
      color: var(--neon-blue);
    }

    .option-btn:active {
      transform: scale(0.97);
    }

    .option-btn.correct {
      border-color: var(--success);
      background: rgba(57, 255, 20, 0.1);
      color: var(--success);
    }

    .option-btn.correct .opt-letter {
      background: var(--success);
      color: #0a0b1a;
    }

    .option-btn.wrong {
      border-color: var(--danger);
      background: rgba(255, 58, 94, 0.1);
      color: var(--danger);
    }

    .option-btn.wrong .opt-letter {
      background: var(--danger);
      color: white;
    }

    .option-btn.disabled {
      pointer-events: none;
      opacity: 0.5;
    }

    .superpower-popup {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      font-family: 'Orbitron', sans-serif;
      font-size: 1.1rem;
      font-weight: 800;
      padding: 8px 20px;
      border-radius: var(--radius-md);
      z-index: 15;
      pointer-events: none;
      opacity: 0;
      white-space: nowrap;
    }

    .superpower-popup.show {
      animation: superpowerPop 1.2s ease forwards;
    }

    @keyframes superpowerPop {
      0% { transform: translate(-50%, -50%) scale(0) rotate(-10deg); opacity: 0; }
      20% { transform: translate(-50%, -50%) scale(1.3) rotate(3deg); opacity: 1; }
      50% { transform: translate(-50%, -60%) scale(1) rotate(0deg); opacity: 1; }
      100% { transform: translate(-50%, -100%) scale(0.8); opacity: 0; }
    }

    .sp-double { color: var(--neon-yellow); text-shadow: 0 0 15px rgba(255, 215, 0, 0.5); }
    .sp-triple { color: var(--neon-orange); text-shadow: 0 0 15px rgba(255, 123, 46, 0.5); }
    .sp-critical { color: var(--neon-red); text-shadow: 0 0 15px rgba(255, 58, 94, 0.5); }
    .sp-freeze { color: var(--neon-blue); text-shadow: 0 0 15px rgba(0, 212, 255, 0.5); }
    .sp-bomb { color: var(--neon-purple); text-shadow: 0 0 15px rgba(193, 86, 255, 0.5); }

    .quiz-timer-bar {
      height: 3px;
      background: var(--bg-glass);
      flex-shrink: 0;
    }

    .quiz-timer-bar .timer-fill {
      height: 100%;
      background: var(--neon-green);
      transition: width 0.1s linear, background-color var(--transition-fast);
      border-radius: 2px;
    }

    .quiz-timer-bar .timer-fill.warning { background: var(--warning); }
    .quiz-timer-bar .timer-fill.danger { background: var(--danger); }

    /* RESULTS SCREEN */
    #results-screen {
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 30px;
      background:
        radial-gradient(circle at 50% 30%, rgba(255, 215, 0, 0.08) 0%, transparent 40%),
        var(--bg-primary);
    }

    .results-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.5rem;
      font-weight: 900;
      background: linear-gradient(135deg, var(--neon-yellow), var(--neon-orange));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-align: center;

    function shuffleArray(arr) {
      const shuffled = [...arr];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    class AudioManager {
      constructor() {
        this.ctx = null;
        this.enabled = true;
        this.masterVolume = 0.3;
      }
      init() {
        try {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        } catch (e) {
          console.warn('Web Audio API not supported');
          this.enabled = false;
        }
      }
      resume() {
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      _createOscillator(freq, type, duration, volume = 0.3) {
        if (!this.enabled || !this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        gain.gain.setValueAtTime(volume * this.masterVolume, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + duration);
      }
      _createNoise(duration, volume = 0.2) {
        if (!this.enabled || !this.ctx) return;
        const bufferSize = this.ctx.sampleRate * duration;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const source = this.ctx.createBufferSource();
        const gain = this.ctx.createGain();
        source.buffer = buffer;
        gain.gain.setValueAtTime(volume * this.masterVolume, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
        source.connect(gain);
        gain.connect(this.ctx.destination);
        source.start();
      }
      playShoot() {
        this._createOscillator(880, 'square', 0.1, 0.2);
        setTimeout(() => this._createOscillator(660, 'square', 0.05, 0.15), 50);
      }
      playHit() {
        this._createNoise(0.1, 0.3);
        this._createOscillator(200, 'sine', 0.1, 0.2);
      }
      playZombieDeath() {
        this._createOscillator(300, 'sawtooth', 0.3, 0.25);
        setTimeout(() => this._createOscillator(150, 'sawtooth', 0.3, 0.2), 100);
        setTimeout(() => this._createNoise(0.2, 0.2), 150);
      }
      playCorrect() {
        this._createOscillator(523, 'sine', 0.1, 0.3);
        setTimeout(() => this._createOscillator(659, 'sine', 0.1, 0.3), 100);
        setTimeout(() => this._createOscillator(784, 'sine', 0.15, 0.3), 200);
      }
      playWrong() {
        this._createOscillator(200, 'square', 0.2, 0.2);
        setTimeout(() => this._createOscillator(150, 'square', 0.3, 0.2), 150);
      }
      playSuperpower() {
        for (let i = 0; i < 5; i++) {
          setTimeout(() => this._createOscillator(400 + i * 150, 'sine', 0.1, 0.25), i * 60);
        }
        setTimeout(() => this._createNoise(0.15, 0.15), 300);
      }
      playBossAppear() {
        this._createOscillator(80, 'sawtooth', 0.5, 0.4);
        this._createOscillator(85, 'sawtooth', 0.5, 0.35);
        setTimeout(() => {

          this._createNoise(0.3, 0.2);
        }, 400);
      }
      playWaveComplete() {
        [523, 659, 784, 1047].forEach((note, i) => {
          setTimeout(() => this._createOscillator(note, 'sine', 0.2, 0.3), i * 150);
        });
      }
      playBaseHit() {
        this._createOscillator(100, 'square', 0.3, 0.4);
        this._createNoise(0.2, 0.3);
      }
      playGameOver() {
        [400, 350, 300, 200].forEach((note, i) => {
          setTimeout(() => this._createOscillator(note, 'sawtooth', 0.4, 0.3), i * 300);
        });
      }
      playVictory() {
        [523, 659, 784, 1047, 784, 1047, 1319].forEach((note, i) => {
          setTimeout(() => this._createOscillator(note, 'sine', 0.25, 0.3), i * 150);
        });
      }
      playBomb() {
        this._createNoise(0.5, 0.4);
        this._createOscillator(60, 'sine', 0.5, 0.4);
      }
      playFreeze() {
        this._createOscillator(1200, 'sine', 0.3, 0.2);

      }

        let zColor = isBoss ? '#3a1a5e' : (isTank ? '#334155' : (isRunner ? '#b91c1c' : '#2d5a27'));
        let zDark = isBoss ? '#2a0e44' : (isTank ? '#1e293b' : (isRunner ? '#7f1d1d' : '#1a3a18'));

        ctx.fillStyle = zColor; ctx.beginPath(); ctx.roundRect(-bodyW / 2, -bodyH / 2, bodyW, bodyH, 3); ctx.fill();
        ctx.fillStyle = zDark; ctx.fillRect(-bodyW / 2, bodyH * 0.05, bodyW, bodyH * 0.4);
        const aw = Math.sin(this.time * (isRunner ? 7 : 4.5) + zombie.id) * 12;
        ctx.strokeStyle = zColor; ctx.lineWidth = 3 * scale; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(bodyW / 2, -bodyH * 0.22); ctx.lineTo(bodyW / 2 + 10 * scale, -bodyH * 0.28 + aw / 3); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-bodyW / 2, -bodyH * 0.18); ctx.lineTo(-bodyW / 2 - 7 * scale, -bodyH * 0.22 - aw / 4); ctx.stroke();
        ctx.fillStyle = zColor; ctx.beginPath(); ctx.arc(0, -bodyH / 2 - headR + 2, headR, 0, Math.PI * 2); ctx.fill();

        let eyeColor = isBoss ? '#ff0055' : (isRunner ? '#ff7700' : (isTank ? '#38bdf8' : '#ff2222'));
        ctx.shadowColor = eyeColor; ctx.shadowBlur = isBoss ? 7 : 4; ctx.fillStyle = eyeColor;
        ctx.beginPath(); ctx.arc(-3 * scale, -bodyH / 2 - headR + 1, 1.6 * scale, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(3 * scale, -bodyH / 2 - headR + 1, 1.6 * scale, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;

        if (isBoss) {
          ctx.fillStyle = '#ffd700'; ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 5;
          const hy = -bodyH / 2 - headR;
          ctx.beginPath(); ctx.moveTo(-headR, hy); ctx.lineTo(-headR + 3, hy - 13); ctx.lineTo(-headR + 7, hy); ctx.fill();
          ctx.beginPath(); ctx.moveTo(headR - 7, hy); ctx.lineTo(headR - 3, hy - 13); ctx.lineTo(headR, hy); ctx.fill(); ctx.shadowBlur = 0;
          ctx.fillStyle = '#ff3a5e'; ctx.font = 'bold 7px Orbitron, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.fillText('BOSS', 0, hy - 13);
        } else if (isTank) {
          ctx.fillStyle = '#38bdf8'; ctx.font = 'bold 6px Orbitron, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.fillText('TANK', 0, -bodyH / 2 - headR - 2);
        } else if (isRunner) {
          ctx.fillStyle = '#f97316'; ctx.font = 'bold 6px Orbitron, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.fillText('RUNNER', 0, -bodyH / 2 - headR - 2);
        }
        ctx.restore();
        const hpRatio = zombie.hp / zombie.maxHp, hpY = y - bodyH - headR - (isBoss ? 22 : 10) + bob, hpBarW = 26 * scale;
        ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(x - hpBarW / 2, hpY, hpBarW, 3);
        ctx.fillStyle = hpRatio > 0.5 ? '#39ff14' : hpRatio > 0.25 ? '#ffd700' : '#ff3a5e';
        ctx.fillRect(x - hpBarW / 2, hpY, hpBarW * Math.max(0, hpRatio), 3);
        ctx.fillStyle = '#ffffff'; ctx.font = `bold ${isBoss ? 12 : 10}px Orbitron, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
        ctx.shadowColor = 'rgba(0,0,0,0.9)'; ctx.shadowBlur = 4; ctx.fillText(Math.ceil(zombie.hp), x, hpY - 2); ctx.shadowBlur = 0;
      }
      addLaser(fromX, fromY, toX, toY, color) { this.lasers.push({ fromX, fromY, toX, toY, color, life: 1 }); }
      updateAndDrawLasers(dt) {
        const ctx = this.ctx;
        for (let i = this.lasers.length - 1; i >= 0; i--) {
          const l = this.lasers[i]; l.life -= dt * 2.8;
          if (l.life <= 0) { this.lasers.splice(i, 1); continue; }
          ctx.save(); ctx.globalAlpha = l.life * 0.15; ctx.strokeStyle = l.color; ctx.lineWidth = 12; ctx.shadowColor = l.color; ctx.shadowBlur = 20;
          ctx.beginPath(); ctx.moveTo(l.fromX, l.fromY); ctx.lineTo(l.toX, l.toY); ctx.stroke();
          ctx.globalAlpha = l.life * 0.65; ctx.lineWidth = 3; ctx.shadowBlur = 10;
          ctx.beginPath(); ctx.moveTo(l.fromX, l.fromY); ctx.lineTo(l.toX, l.toY); ctx.stroke();
          ctx.globalAlpha = l.life; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.2; ctx.shadowBlur = 0;
          ctx.beginPath(); ctx.moveTo(l.fromX, l.fromY); ctx.lineTo(l.toX, l.toY); ctx.stroke();
          if (l.life > 0.6) {
            ctx.globalAlpha = (l.life - 0.6) * 2.5; ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(l.toX, l.toY, 6 * l.life, 0, Math.PI * 2); ctx.fill();
          }
          ctx.restore();
        }
      }
      addParticles(x, y, color, count = 8, speed = 3) {
        for (let i = 0; i < count; i++) {
          const angle = (Math.PI * 2 * i) / count + Math.random() * 0.5;
          this.particles.push({ x, y, vx: Math.cos(angle) * speed * (0.5 + Math.random()), vy: Math.sin(angle) * speed * (0.5 + Math.random()), life: 1, decay: 0.02 + Math.random() * 0.02, color, size: 2 + Math.random() * 3 });
        }
      }
      addExplosion(x, y, color) { this.addParticles(x, y, color, 14, 5); this.addParticles(x, y, '#ffffff', 5, 3); }
      addFreezeParticles(x, y) {
        for (let i = 0; i < 10; i++) {
          this.particles.push({ x: x + (Math.random() - 0.5) * 30, y: y + (Math.random() - 0.5) * 20, vx: (Math.random() - 0.5) * 1, vy: -Math.random() * 2, life: 1, decay: 0.015, color: '#00d4ff', size: 2 + Math.random() * 3, isSnowflake: true });
        }
      }
      updateAndDrawParticles() {
        const ctx = this.ctx;
        for (let i = this.particles.length - 1; i >= 0; i--) {
          const p = this.particles[i]; p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.life -= p.decay;
          if (p.life <= 0) { this.particles.splice(i, 1); continue; }
          ctx.globalAlpha = p.life; ctx.fillStyle = p.color;
          if (p.isSnowflake) { ctx.font = `${p.size * 3}px sans-serif`; ctx.textAlign = 'center'; ctx.fillText('❄', p.x, p.y); }
          else { ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2); ctx.fill(); }
          ctx.globalAlpha = 1;
        }
      }
      addDamageNumber(x, y, damage, superType) {
        const colors = { normal: '#ffffff', double: '#ffd700', triple: '#ff7b2e', critical: '#ff3a5e', freeze: '#00d4ff', bomb: '#c156ff' };
        this.damageNumbers.push({ x: x + (Math.random() - 0.5) * 20, y, text: `-${damage}`, color: colors[superType] || '#ffffff', life: 1, size: superType === 'normal' ? 13 : 17, label: superType !== 'normal' ? superType.toUpperCase() + '!' : null });
      }
      updateAndDrawDamageNumbers() {
        const ctx = this.ctx;
        for (let i = this.damageNumbers.length - 1; i >= 0; i--) {
          const d = this.damageNumbers[i]; d.y -= 1.2; d.life -= 0.018;
          if (d.life <= 0) { this.damageNumbers.splice(i, 1); continue; }
          ctx.globalAlpha = d.life; ctx.fillStyle = d.color; ctx.font = `bold ${d.size}px Orbitron, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
          ctx.shadowColor = d.color; ctx.shadowBlur = 6; ctx.fillText(d.text, d.x, d.y);
          if (d.label) { ctx.font = `bold ${d.size - 4}px Orbitron, sans-serif`; ctx.fillText(d.label, d.x, d.y - d.size - 2); }
          ctx.shadowBlur = 0; ctx.globalAlpha = 1;
        }
      }
      applyScreenShake(intensity = 5) { this.screenShake.intensity = Math.max(this.screenShake.intensity, intensity); }
      beginFrame() {
        if (this.screenShake.intensity > 0) {
          this.screenShake.x = (Math.random() - 0.5) * this.screenShake.intensity;
          this.screenShake.y = (Math.random() - 0.5) * this.screenShake.intensity;
          this.screenShake.intensity *= 0.88;
          if (this.screenShake.intensity < 0.3) { this.screenShake.intensity = 0; this.screenShake.x = 0; this.screenShake.y = 0; }
          this.ctx.save(); this.ctx.translate(this.screenShake.x, this.screenShake.y);
        }
      }
      endFrame() { if (this.screenShake.x !== 0 || this.screenShake.y !== 0) this.ctx.restore(); }
      tick() { this.time += 0.016; }
    }

    // ============================================================
    // 4. QUIZ MANAGER
    // ============================================================
    class QuizManager {
      constructor(numTeams, questionTimerMax = 20) {
        this.numTeams = numTeams;
        this.teamQueues = [];
        this.currentQuestions = [];
        this.questionStartTimes = [];
        this.answeredCounts = [];
        this.correctCounts = [];
        this.locked = [];
        this.questionTimerMax = questionTimerMax;
        this.questionTimers = [];

        for (let i = 0; i < numTeams; i++) {
          this.teamQueues.push(shuffleArray([...QUESTIONS]));
          this.currentQuestions.push(null);
          this.questionStartTimes.push(0);
          this.answeredCounts.push(0);
          this.correctCounts.push(0);
          this.locked.push(false);
          this.questionTimers.push(this.questionTimerMax);
        }
      }
      getNextQuestion(teamIdx) {
        if (this.teamQueues[teamIdx].length === 0) {
          this.teamQueues[teamIdx] = shuffleArray([...QUESTIONS]);
        }
        const q = this.teamQueues[teamIdx].shift();
        const correctText = q.options[q.answer];
        const shuffledOptions = shuffleArray([...q.options]);
        const newAnswer = shuffledOptions.indexOf(correctText);

        this.currentQuestions[teamIdx] = { question: q.question, options: shuffledOptions, answer: newAnswer, topic: q.topic, difficulty: q.difficulty };
        this.questionStartTimes[teamIdx] = Date.now();
        this.questionTimers[teamIdx] = this.questionTimerMax;
        this.locked[teamIdx] = false;
        return this.currentQuestions[teamIdx];
      }
      checkAnswer(teamIdx, answerIdx) {
        if (this.locked[teamIdx]) return null;
        const q = this.currentQuestions[teamIdx];
        if (!q) return null;

        this.locked[teamIdx] = true;
        this.answeredCounts[teamIdx]++;
        const timeElapsed = (Date.now() - this.questionStartTimes[teamIdx]) / 1000;
        const isCorrect = answerIdx === q.answer;
        if (isCorrect) this.correctCounts[teamIdx]++;

        return { correct: isCorrect, correctAnswer: q.answer, timeElapsed, superpower: isCorrect ? this._calculateSuperpower(timeElapsed) : null };
      }
      _calculateSuperpower(timeElapsed) {
        const roll = Math.random();
        if (timeElapsed < 3) {
          if (roll < 0.3) return { type: 'critical', damage: 200, label: '💀 CRITICAL HIT!', cssClass: 'sp-critical' };
          if (roll < 0.5) return { type: 'triple', damage: 150, label: '🔥 TRIPLE POWER!', cssClass: 'sp-triple' };
          return { type: 'double', damage: 100, label: '⚡ DOUBLE POWER!', cssClass: 'sp-double' };
        }
        if (timeElapsed < 5) {
          if (roll < 0.05) return { type: 'bomb', damage: 100, label: '💣 BOMB!', cssClass: 'sp-bomb', aoe: true };
          if (roll < 0.15) return { type: 'freeze', damage: 50, label: '❄️ FREEZE!', cssClass: 'sp-freeze', freeze: true };
          if (roll < 0.30) return { type: 'double', damage: 100, label: '⚡ DOUBLE POWER!', cssClass: 'sp-double' };
          return { type: 'normal', damage: 50, label: null, cssClass: null };
        }
        if (roll < 0.03) return { type: 'bomb', damage: 100, label: '💣 BOMB!', cssClass: 'sp-bomb', aoe: true };
        if (roll < 0.08) return { type: 'critical', damage: 200, label: '💀 CRITICAL HIT!', cssClass: 'sp-critical' };
        if (roll < 0.13) return { type: 'freeze', damage: 50, label: '❄️ FREEZE!', cssClass: 'sp-freeze', freeze: true };
        if (roll < 0.23) return { type: 'double', damage: 100, label: '⚡ DOUBLE POWER!', cssClass: 'sp-double' };
        return { type: 'normal', damage: 50, label: null, cssClass: null };
      }
      updateTimers(dt) {
        for (let i = 0; i < this.numTeams; i++) {
          if (!this.locked[i] && this.currentQuestions[i]) {
            this.questionTimers[i] -= dt;
            if (this.questionTimers[i] <= 0) {
              this.questionTimers[i] = 0;
              return { teamIdx: i, timedOut: true };
            }
          }
        }
        return null;
      }
      getTimerRatio(teamIdx) { return Math.max(0, this.questionTimers[teamIdx] / this.questionTimerMax); }
      getStats(teamIdx) {
        return {
          answered: this.answeredCounts[teamIdx],
          correct: this.correctCounts[teamIdx],
          accuracy: this.answeredCounts[teamIdx] > 0 ? Math.round((this.correctCounts[teamIdx] / this.answeredCounts[teamIdx]) * 100) : 0
        };
      }
    }

            this.audio.playClick();

      _loadQuestion(teamIdx) {
        const q = this.quiz.getNextQuestion(teamIdx);
        const letters = ['A', 'B', 'C', 'D'];
        document.getElementById(`q-topic-${teamIdx}`).textContent = q.topic;
        document.getElementById(`q-text-${teamIdx}`).textContent = q.question;

        const optionsContainer = document.getElementById(`q-options-${teamIdx}`);
        optionsContainer.innerHTML = '';
        q.options.forEach((opt, idx) => {
          const btn = document.createElement('button');
          btn.className = 'option-btn';
          btn.innerHTML = `<span class="opt-letter">${letters[idx]}</span><span>${opt}</span>`;
          btn.addEventListener('click', () => this._onAnswer(teamIdx, idx));
          btn.addEventListener('touchend', (e) => { e.preventDefault(); this._onAnswer(teamIdx, idx); });
          optionsContainer.appendChild(btn);
        });
      }
      _onAnswer(teamIdx, answerIdx) {
        if (this.state !== 'playing' || this.gameOver) return;
        const result = this.quiz.checkAnswer(teamIdx, answerIdx);
        if (!result) return;

        const panel = document.getElementById(`quiz-panel-${teamIdx}`);
        const options = document.querySelectorAll(`#q-options-${teamIdx} .option-btn`);
        options.forEach((btn, i) => {
          btn.classList.add('disabled');
          if (i === this.quiz.currentQuestions[teamIdx].answer) btn.classList.add('correct');
          if (i === answerIdx && !result.correct) btn.classList.add('wrong');
        });

        if (result.correct) {
          panel.classList.add('correct-flash');
          this.audio.playCorrect();
          this._fireAtZombie(teamIdx, result.superpower);
          if (result.superpower && result.superpower.label) {
            this._showSuperpowerPopup(teamIdx, result.superpower);
            this.audio.playSuperpower();
          }
        } else {
          panel.classList.add('wrong-flash', 'shake');
          this.audio.playWrong();
        }

        this._updatePanelStats(teamIdx);
        setTimeout(() => {
          panel.classList.remove('correct-flash', 'wrong-flash', 'shake');
          if (this.state === 'playing') this._loadQuestion(teamIdx);
        }, 1200);
      }
      _onTimeout(teamIdx) {
        const panel = document.getElementById(`quiz-panel-${teamIdx}`);
        const options = document.querySelectorAll(`#q-options-${teamIdx} .option-btn`);
        this.quiz.locked[teamIdx] = true;
        this.quiz.answeredCounts[teamIdx]++;
        options.forEach((btn, i) => {
          btn.classList.add('disabled');
          if (i === this.quiz.currentQuestions[teamIdx].answer) btn.classList.add('correct');
        });
        panel.classList.add('wrong-flash', 'shake');
        this.audio.playWrong();
        this._updatePanelStats(teamIdx);
        setTimeout(() => {
          panel.classList.remove('wrong-flash', 'shake');
          if (this.state === 'playing') this._loadQuestion(teamIdx);
        }, 1200);
      }
      _showSuperpowerPopup(teamIdx, sp) {
        const el = document.getElementById(`sp-popup-${teamIdx}`);
        el.textContent = sp.label;
        el.className = `superpower-popup ${sp.cssClass}`;
        void el.offsetWidth;
        el.classList.add('show');
        setTimeout(() => el.classList.remove('show'), 1200);
      }
      _updatePanelStats(teamIdx) {
        const stats = this.quiz.getStats(teamIdx);
        document.getElementById(`stat-dmg-${teamIdx}`).textContent = this.teamDamage[teamIdx];
        document.getElementById(`stat-kills-${teamIdx}`).textContent = this.teamKills[teamIdx];
        document.getElementById(`stat-accuracy-${teamIdx}`).textContent = stats.accuracy + '%';
      }
      _fireAtZombie(teamIdx, superpower) {
        if (!superpower) return;
        const alive = this.zombies.filter(z => z.hp > 0).sort((a, b) => b.x - a.x);
        if (alive.length === 0) return;
        const towerPos = this.renderer.getTowerPositions(this.numTeams)[teamIdx];
        const color = this.renderer.teamColors[teamIdx];

        if (superpower.aoe) {
          alive.forEach(z => {
            this._applyDamage(teamIdx, z, superpower.damage, superpower.type);
            this.renderer.addLaser(towerPos.x, towerPos.y, z.x, z.y, color);
          });
          this.audio.playBomb();
          this.renderer.applyScreenShake(6);
        } else {
          const target = alive[0];
          this._applyDamage(teamIdx, target, superpower.damage, superpower.type);
          this.renderer.addLaser(towerPos.x, towerPos.y, target.x, target.y, color);
          if (superpower.freeze) {
            target.frozen = true; target.frozenTimer = 3;
            this.renderer.addFreezeParticles(target.x, target.y);
            this.audio.playFreeze();
          }
          this.audio.playShoot();
          this.renderer.applyScreenShake(superpower.damage > 50 ? 4 : 2);
        }
      }
      _applyDamage(teamIdx, zombie, damage, superType) {
        const actualDmg = Math.min(damage, zombie.hp);
        zombie.hp -= damage;
        this.teamDamage[teamIdx] += actualDmg;
        this.renderer.addDamageNumber(zombie.x, zombie.y - 20, damage, superType);
        this.renderer.addParticles(zombie.x, zombie.y, this.renderer.teamColors[teamIdx], 5, 2);
        if (zombie.hp <= 0) {
          this.teamKills[teamIdx]++;
          if (zombie.isBoss) this.teamBossKills[teamIdx]++;
        }
        this._recalcScores();
      }
      _recalcScores() {
        for (let i = 0; i < this.numTeams; i++) {
          this.teamScores[i] = this.teamDamage[i] + this.teamKills[i] * 100 + this.teamBossKills[i] * 400;
        }
      }
      _startNextWave() {
        if (this.currentWave >= this.totalWaves) { this._endGame(true); return; }
        this.spawnedCount = 0;
        this.spawnTimer = 1500;
        this.waveSpawningDone = false;
        this.waveCooldown = 3;
        this._announceWave();
        document.getElementById('wave-display').textContent = `WAVE ${this.currentWave + 1} / ${this.totalWaves}`;
      }
      _announceWave() {
        const el = this.waveAnnounceEl;
        const isFinal = this.currentWave === this.totalWaves - 1;
        el.textContent = isFinal ? '💀 FINAL WAVE' : `⚔️ WAVE ${this.currentWave + 1}`;
        el.className = 'wave-announce' + (isFinal ? ' boss-announce' : '');
        void el.offsetWidth;
        el.classList.add('show');
        this.audio.playWaveComplete();
        setTimeout(() => el.classList.remove('show', 'boss-announce'), 2500);
      }
      _spawnZombie() {
        const config = this.waveConfigs[this.currentWave];
        if (this.spawnedCount >= config.count) return;
        const isBoss = this.spawnedCount >= config.count - config.bossCount;
        const mode = this.difficulty || 'normal';

        const rand = Math.random();
        let isRunner = false;
        let isTank = false;

        if (!isBoss) {
          if (mode === 'easy') {
            // Easy: Varian sedikit (runner muncul jarang di wave 3+)
            isRunner = (this.currentWave >= 2) && (rand < 0.15);
            isTank = false;
          } else if (mode === 'hard') {
            // Hard: Varian penuh & agresif dari wave awal
            isRunner = rand < 0.35;
            isTank = !isRunner && (this.currentWave >= 1) && (rand > 0.65);
          } else {
            // Normal: Varian seimbang
            isRunner = (this.currentWave >= 1) && (rand < 0.25);
            isTank = !isRunner && (this.currentWave >= 2) && (rand > 0.75);
          }
        }

        let hp;
        let speed;
        if (isBoss) {
          const bossBonus = mode === 'hard' ? 60 : (mode === 'easy' ? 0 : 30);
          hp = 220 + Math.random() * 100 + this.currentWave * 30 + bossBonus;
          speed = (mode === 'hard' ? 0.28 : (mode === 'easy' ? 0.20 : 0.24)) + Math.random() * 0.08;
        } else if (isTank) {
          hp = Math.round(config.hpMax * 1.45 + Math.random() * 35);
          speed = (mode === 'hard' ? 0.36 : 0.32) + Math.random() * 0.1;
        } else if (isRunner) {
          hp = Math.round(Math.max(35, config.hpMin * 0.8) + Math.random() * 15);
          speed = (mode === 'hard' ? 0.72 : (mode === 'easy' ? 0.52 : 0.65)) + Math.random() * 0.20;
        } else {
          hp = Math.round(config.hpMin + Math.random() * (config.hpMax - config.hpMin));
          speed = (mode === 'hard' ? 0.48 : (mode === 'easy' ? 0.35 : 0.42)) + Math.random() * 0.18;
        }

        this.zombies.push({
          id: this.zombieIdCounter++,
          x: -35 - Math.random() * 40,
          y: this.renderer.getSpawnY(),
          hp: Math.round(hp),
          maxHp: Math.round(hp),
          speed: speed,
          isBoss,
          isRunner,
          isTank,
          frozen: false,
          frozenTimer: 0
        });
        this.spawnedCount++;
        if (isBoss) {
          this.audio.playBossAppear();
          const el = this.waveAnnounceEl;
          el.textContent = '👹 BOSS ZOMBIE!';
          el.className = 'wave-announce boss-announce';
          void el.offsetWidth;
          el.classList.add('show');
          setTimeout(() => el.classList.remove('show', 'boss-announce'), 2000);
        }
      }
      _loop(timestamp) {
        if (this.state !== 'playing') return;
        const dt = Math.min((timestamp - this.lastTime) / 1000, 0.05);
        this.lastTime = timestamp;
        this._update(dt);
        this._render(dt);
        this.animFrame = requestAnimationFrame(t => this._loop(t));
      }
      _update(dt) {
        const timeout = this.quiz.updateTimers(dt);
        if (timeout) this._onTimeout(timeout.teamIdx);

        for (let i = 0; i < this.numTeams; i++) {
          const ratio = this.quiz.getTimerRatio(i);
          const fill = document.getElementById(`timer-fill-${i}`);
          if (fill) {
            fill.style.width = (ratio * 100) + '%';
            fill.classList.toggle('warning', ratio < 0.5 && ratio > 0.25);
            fill.classList.toggle('danger', ratio <= 0.25);
          }
        }

        const config = this.waveConfigs[this.currentWave];
        if (!this.waveSpawningDone) {
          this.spawnTimer -= dt * 1000;
          if (this.spawnTimer <= 0 && this.spawnedCount < config.count) {
            this._spawnZombie();
            this.spawnTimer = config.spawnDelay + Math.random() * 300;
          }
          if (this.spawnedCount >= config.count) this.waveSpawningDone = true;
        }

        const baseReachX = this.renderer.getBaseReachX();
        for (let i = this.zombies.length - 1; i >= 0; i--) {
          const z = this.zombies[i];
          if (z.frozen) {
            z.frozenTimer -= dt;
            if (z.frozenTimer <= 0) z.frozen = false;
          }
          if (!z.frozen) z.x += z.speed * 60 * dt;
          if (z.x >= baseReachX) {
            z.x = baseReachX;
            const rates = this.baseDamageRate || { normal: 2.2, runner: 3.2, tank: 4.2, boss: 8.0 };
            const dmgPerSec = z.isBoss ? rates.boss : (z.isTank ? rates.tank : (z.isRunner ? rates.runner : rates.normal));
            const dmg = dmgPerSec * dt;
            this.baseHp -= dmg;
            if (Math.random() < 0.05) this.audio.playBaseHit();
            this.renderer.applyScreenShake(2);
            if (this.baseHp <= 0) {
              this.baseHp = 0;
              this._endGame(false);
              return;
            }
          }
          if (z.hp <= 0) {
            this.renderer.addExplosion(z.x, z.y, z.isBoss ? '#c156ff' : (z.isRunner ? '#f97316' : (z.isTank ? '#38bdf8' : '#39ff14')));
            this.audio.playZombieDeath();
            this.zombies.splice(i, 1);
          }
        }

        const aliveZombies = this.zombies.filter(z => z.hp > 0);
        const remainingInWave = (config.count - this.spawnedCount) + aliveZombies.length;
        const waveDisplay = document.getElementById('wave-display');
        if (waveDisplay) {
          waveDisplay.textContent = `WAVE ${this.currentWave + 1} / ${this.totalWaves} (${remainingInWave} 🧟)`;
        }

        if (this.waveSpawningDone && aliveZombies.length === 0) {
          this.waveCooldown -= dt;
          if (this.waveCooldown <= 0) {
            this.currentWave++;
            if (this.currentWave >= this.totalWaves) this._endGame(true);
            else {
              this.waveCooldown = 3;
              setTimeout(() => this._startNextWave(), 2200);
            }
          }
        }

        const hpFill = document.getElementById('base-hp-fill');
        const hpText = document.getElementById('base-hp-text');
        if (hpFill && hpText) {
          const ratio = Math.max(0, this.baseHp / this.maxBaseHp);
          hpFill.style.width = (ratio * 100) + '%';
          hpFill.classList.toggle('warning', ratio < 0.5 && ratio > 0.25);
          hpFill.classList.toggle('danger', ratio <= 0.25);
          hpText.textContent = `${Math.ceil(this.baseHp)} / ${this.maxBaseHp}`;
        }

        this._updateLeaderboard();
        this.renderer.tick();
      }
      _render(dt) {
        const r = this.renderer;
        r.clear();
        r.drawBackground();
        r.beginFrame();
        r.drawPath();
        r.drawBase(this.baseHp, this.maxBaseHp);

        const alive = this.zombies.filter(z => z.hp > 0).sort((a, b) => b.x - a.x);
        const frontTarget = alive.length > 0 ? { x: alive[0].x, y: alive[0].y } : null;

        const towerPositions = r.getTowerPositions(this.numTeams);
        for (let i = 0; i < this.numTeams; i++) {
          r.drawTower(towerPositions[i], i, this.teamNames[i], this.teamDamage[i], this.teamKills[i], frontTarget);
        }

        const sorted = [...this.zombies].filter(z => z.hp > 0).sort((a, b) => a.x - b.x);
        sorted.forEach(z => r.drawZombie(z));

        r.updateAndDrawLasers(dt);
        r.updateAndDrawParticles();
        r.updateAndDrawDamageNumbers();
        r.endFrame();
      }
      _updateLeaderboard() {
        let maxScore = -1, leadIdx = -1;
        for (let i = 0; i < this.numTeams; i++) {
          const el = document.getElementById(`lb-score-${i}`);
          if (el) el.textContent = this.teamScores[i];
          if (this.teamScores[i] > maxScore) {
            maxScore = this.teamScores[i];
            leadIdx = i;
          }
        }
        for (let i = 0; i < this.numTeams; i++) {
          const el = document.getElementById(`lb-team-${i}`);
          if (el) el.classList.toggle('leading', i === leadIdx && maxScore > 0);
        }
      }
      _endGame(victory) {
        if (this.gameOver) return;
        this.gameOver = true;
        if (victory) {
          const bonus = Math.ceil(this.baseHp) * 2;
          for (let i = 0; i < this.numTeams; i++) this.teamScores[i] += bonus;
        }
        this._recalcScores();
        if (victory) this.audio.playVictory();
        else this.audio.playGameOver();

        setTimeout(() => {
          this.state = 'results';
          if (this.animFrame) cancelAnimationFrame(this.animFrame);
          this._showResults(victory);
        }, 1500);
      }
      _showResults(victory) {
        this.gameScreen.classList.remove('active');
        this.resultsScreen.classList.add('active');

        document.getElementById('results-title').textContent = victory ? '🏆 BASE BERHASIL DIPERTAHANKAN!' : '💀 BASE TELAH HANCUR!';
        document.getElementById('results-title').style.background = victory ? 'linear-gradient(135deg, #ffd700, #ff7b2e)' : 'linear-gradient(135deg, #ff3a5e, #c156ff)';
        document.getElementById('results-title').style.webkitBackgroundClip = 'text';
        document.getElementById('results-title').style.webkitTextFillColor = 'transparent';
        document.getElementById('results-title').style.backgroundClip = 'text';

        const sorted = this.teamNames.map((name, i) => ({
          name, idx: i,
          score: this.teamScores[i],
          damage: this.teamDamage[i],
          kills: this.teamKills[i],
          bossKills: this.teamBossKills[i],
          stats: this.quiz.getStats(i)
        })).sort((a, b) => b.score - a.score);

        const colors = ['#ff4466', '#4488ff', '#44dd66', '#ffcc22'];
        const podium = document.getElementById('podium');
        podium.innerHTML = '';
        const ranks = ['🥇', '🥈', '🥉', '4️⃣'];
        const classes = ['first', 'second', 'third', ''];

        sorted.forEach((team, i) => {
          const place = document.createElement('div');
          place.className = `podium-place ${classes[i] || ''}`;
          place.style.borderColor = colors[team.idx];

          place.innerHTML = `
            <div class="podium-rank" style="color:${colors[team.idx]}">${ranks[i] || (i + 1)}</div>
            <div class="podium-team-name" style="color:${colors[team.idx]}">${team.name}</div>
            <div class="podium-score" style="color:${colors[team.idx]}">${team.score}</div>
            <div class="podium-stats">
              💥 Damage: ${team.damage}<br>
              ☠ Kills: ${team.kills} (Boss: ${team.bossKills})<br>
              🎯 Akurasi: ${team.stats.accuracy}%<br>
              📝 Jawab: ${team.stats.correct}/${team.stats.answered}
            </div>
          `;
          podium.appendChild(place);
        });

        document.getElementById('winner-name').textContent = sorted[0].name;
        document.getElementById('winner-name').style.color = colors[sorted[0].idx];
        const diffLabel = this.difficulty.toUpperCase();
        const diffColor = this.difficulty === 'easy' ? '#10b981' : (this.difficulty === 'hard' ? '#ef4444' : '#f59e0b');
        document.getElementById('results-subtitle').innerHTML = victory
          ? `🏰 Base HP tersisa: <strong>${Math.ceil(this.baseHp)}</strong> | Mode: <strong style="color:${diffColor}">${diffLabel}</strong> — Pemenang: <strong id="winner-name" style="color:${colors[sorted[0].idx]}">${sorted[0].name}</strong>`
          : `Mode: <strong style="color:${diffColor}">${diffLabel}</strong> — Kontributor terbaik: <strong id="winner-name" style="color:${colors[sorted[0].idx]}">${sorted[0].name}</strong>`;

        document.getElementById('play-again-btn').onclick = () => {
          this.resultsScreen.classList.remove('active');
          this.setupScreen.classList.add('active');
          this.state = 'setup';
          this.gameOver = false;
        };
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      window.game = new Game();
    });
  </script>
</body>
